# ────────────────────────────────────────────────────────────────────
#  Pac-Man Contribution Graph
#  Generates an animated SVG of Pac-Man eating your contribution grid
#  and publishes it to the `output` branch, ready for your README.
#
#  Setup:
#    1. Save this file at:  .github/workflows/pacman.yml
#       (inside your special <username>/<username> profile repo)
#    2. Go to  Settings → Actions → General → Workflow permissions
#       → enable "Read and write permissions".
#    3. Commit & push. Trigger once manually from the Actions tab.
# ────────────────────────────────────────────────────────────────────

name: Generate Pac-Man Contribution Graph

on:
  # Run automatically once a day at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"

  # Allow manual runs from the Actions tab
  workflow_dispatch:

  # Also run on every push to main so changes take effect immediately
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    name: Generate Pac-Man SVG
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Build the Pac-Man SVGs (light + dark) from your contributions
      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # You can add more games here, comma-separated: pacman,breakout
          games: "pacman"

      # 2. Publish the generated SVGs to the `output` branch
      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
